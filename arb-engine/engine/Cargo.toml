[package]
name = "arb-engine"
version = "0.1.0"
edition = "2021"
authors = ["ARB-DAPP Team"]
description = "Cross-Chain Arbitrage Engine — Phase 1 Backend"

[[bin]]
name = "arb-engine"
path = "src/main.rs"

[[bin]]
name = "seed-base-pools"
path = "src/bin/seed_base_pools.rs"

[[bin]]
name = "cross-chain-testnet"
path = "src/bin/cross_chain_testnet.rs"

[dependencies]
# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1.35", features = ["full"] }

# ── Ethereum / EVM ────────────────────────────────────────────────────────────
alloy = { version = "0.3", features = ["providers", "signers", "signer-local", "contract", "rpc-types", "pubsub", "transport-ws", "provider-ws", "node-bindings", "sol-types"] }

# ── Solana ────────────────────────────────────────────────────────────────────
solana-client = "2.0"
solana-sdk    = "2.0"
solana-account-decoder = "2.0"

# ── Database ──────────────────────────────────────────────────────────────────
sqlx  = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "bigdecimal"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bs58       = "0.5"

# ── Math (fixed-point, no float rounding errors) ──────────────────────────────
primitive-types = { version = "0.12", features = ["serde"] }
uint            = "0.9"

# ── Graph algorithms (Bellman-Ford pathfinding) ───────────────────────────────
petgraph = "0.6"

# ── ABI / Calldata ────────────────────────────────────────────────────────────
hex    = "0.4"
ethabi = "18"

# ── Logging & Observability ───────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# ── Error handling ────────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── HTTP client / server ──────────────────────────────────────────────────────
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# ── Config ────────────────────────────────────────────────────────────────────
dotenvy = "0.15"

# ── Concurrency utilities ─────────────────────────────────────────────────────
dashmap  = "5"          # concurrent hashmap for pool cache
tokio-stream = "0.1"
futures-util = "0.3"    # StreamExt for alloy subscription streams
bincode  = "1.3"

# ── Time ──────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── UUID ──────────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
