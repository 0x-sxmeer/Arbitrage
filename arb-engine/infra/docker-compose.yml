# ─────────────────────────────────────────────────────────────────────────────
#  infra/docker-compose.yml
#  Local development infrastructure: PostgreSQL 16 + Redis 7
#
#  Usage:
#    docker-compose up -d           # start in background
#    docker-compose down            # stop and remove containers
#    docker-compose logs -f         # tail logs
#    docker-compose exec db psql -U arb_user arb_engine   # connect to PG
#    docker-compose exec cache redis-cli                   # connect to Redis
#
#  After `docker-compose up`, the engine will connect automatically
#  using the URLs from .env:
#    DATABASE_URL=postgresql://arb_user:arb_password@localhost:5432/arb_engine
#    REDIS_URL=redis://localhost:6379
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: arb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     arb_user
      POSTGRES_PASSWORD: arb_password
      POSTGRES_DB:       arb_engine
      # Tune for write-heavy workloads (opportunity logging)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Seed file: creates extensions on first boot
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c max_connections=100
        -c wal_level=minimal
        -c synchronous_commit=off
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb_user -d arb_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: arb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --appendonly no
        --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis Insight (optional GUI for Redis debugging) ──────────────────────
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: arb_redis_insight
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      cache:
        condition: service_healthy
    profiles:
      - debug  # only starts with: docker-compose --profile debug up

  # ── pgAdmin (optional GUI for PostgreSQL) ─────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arb_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@arb.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT:      5050
    ports:
      - "5050:5050"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - debug  # only starts with: docker-compose --profile debug up

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  default:
    name: arb_network
