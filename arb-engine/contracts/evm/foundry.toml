# ─────────────────────────────────────────────────────────────────────────────
#  foundry.toml — Foundry configuration for the AtomicArb contract
#
#  Usage:
#    forge build           # compile contracts
#    forge test            # run tests
#    forge script          # deploy scripts
#
#  Dependencies (install via forge install):
#    forge install OpenZeppelin/openzeppelin-contracts
# ─────────────────────────────────────────────────────────────────────────────

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

# Remappings for imports
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# EVM version
evm_version = "paris"

# Testing
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

# Deployment
[etherscan]
# ethereum = { key = "${ETHERSCAN_API_KEY}", chain = "mainnet" }
# base = { key = "${BASESCAN_API_KEY}", chain = "base" }

[rpc_endpoints]
# ethereum = "${ETH_HTTP_URL}"
# base = "${BASE_HTTP_URL}"
