[package]
name = "arb-engine"
version = "2.0.0"
edition = "2021"
authors = ["ARB-DAPP Team"]
description = "Institutional MEV Engine — Phases 1-4 (Flash Loans + CEX-DEX + Liquidations + Cross-Chain)"
default-run = "arb-engine"

[[bin]]
name = "arb-engine"
path = "src/main.rs"

[[bin]]
name = "seed-base-pools"
path = "src/bin/seed_base_pools.rs"

[[bin]]
name = "cross-chain-testnet"
path = "src/bin/cross_chain_testnet.rs"

[[bin]]
name = "clean-db"
path = "src/bin/clean_db.rs"

[dependencies]
# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# ── Ethereum / EVM (alloy v0.7) ───────────────────────────────────────────────
alloy = { version = "0.7", features = [
    "providers",
    "signers",
    "signer-local",
    "contract",
    "rpc-types",
    "pubsub",
    "transport-ws",
    "provider-ws",
    "sol-types",
    "network",
] }

# ── Solana ────────────────────────────────────────────────────────────────────
solana-client          = "2.0"
solana-sdk             = "2.0"
solana-account-decoder = "2.0"

# ── Database ──────────────────────────────────────────────────────────────────
sqlx  = { version = "0.7", features = [
    "postgres", "runtime-tokio-rustls",
    "uuid", "chrono", "bigdecimal"
] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# ── WebSocket (for Binance CEX feed) ─────────────────────────────────────────
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite        = "0.21"

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bs58       = "0.5"

# ── Math ──────────────────────────────────────────────────────────────────────
primitive-types = { version = "0.12", features = ["serde"] }
uint            = "0.9"
# Fixed-point arithmetic for price math (avoids float rounding errors)
fixed = "1.26"

# ── Graph algorithms ──────────────────────────────────────────────────────────
petgraph = "0.6"

# ── ABI / Calldata ────────────────────────────────────────────────────────────
hex    = "0.4"
ethabi = "18"

# ── Logging & Observability ───────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics            = "0.22"
metrics-exporter-prometheus = "0.13"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── HTTP client / server ──────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "stream"
] }
axum       = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# ── Config ────────────────────────────────────────────────────────────────────
dotenvy = "0.15"

# ── Concurrency utilities ─────────────────────────────────────────────────────
dashmap      = "5"
futures-util = "0.3"
futures      = "0.3"
bincode      = "1.3"
parking_lot  = "0.12"   # faster RwLock for hot paths

# ── Time ──────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── UUID ──────────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }

# ── Compression (for bundle calldata) ────────────────────────────────────────
flate2 = "1.0"

# ── Crypto (for Flashbots auth signing) ───────────────────────────────────────
k256    = { version = "0.13", features = ["ecdsa"] }
sha3    = "0.10"

[profile.release]
# Maximum optimization for hot execution paths
opt-level     = 3
lto           = "fat"       # full link-time optimization
codegen-units = 1           # single codegen unit for best inlining
panic         = "abort"     # smaller binary, faster startup
strip         = true        # strip debug symbols
