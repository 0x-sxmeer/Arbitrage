[package]
name    = "arb-engine"
version = "2.0.0"
edition = "2021"
description = "Institutional MEV Engine — Phases 1-4 (10,000+ pool universe)"

[[bin]]
name = "arb-engine"
path = "src/main.rs"

[[bin]]
name = "seed-base-pools"
path = "src/bin/seed_base_pools.rs"

[[bin]]
name = "cross-chain-testnet"
path = "src/bin/cross_chain_testnet.rs"

[[bin]]
name = "clean-db"
path = "src/bin/clean_db.rs"

[dependencies]
# ── Async runtime ──────────────────────────────────────────────────────────────
tokio          = { version = "1.35", features = ["full"] }
tokio-stream   = "0.1"

# ── Ethereum / EVM ─────────────────────────────────────────────────────────────
alloy = { version = "0.7", features = [
    "providers", "signers", "signer-local", "contract",
    "rpc-types", "pubsub", "transport-ws", "provider-ws",
    "sol-types", "network",
] }
primitive-types = { version = "0.12", features = ["serde"] }

# ── Solana ─────────────────────────────────────────────────────────────────────
solana-client          = "2.0"
solana-sdk             = "2.0"
solana-account-decoder = "2.0"

# ── Database ───────────────────────────────────────────────────────────────────
sqlx  = { version = "0.7", features = [
    "postgres", "runtime-tokio-rustls", "uuid", "chrono", "bigdecimal"
] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# ── WebSocket (Binance + private mempool) ──────────────────────────────────────
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite       = "0.21"

# ── HTTP client ────────────────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "stream"
] }

# ── Serialization ──────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bs58       = "0.5"

# ── Math / numeric ─────────────────────────────────────────────────────────────
uint  = "0.9"
fixed = "1.26"

# ── Graph (for LiquidityGraph) ─────────────────────────────────────────────────
petgraph = "0.6"

# ── ABI / calldata ─────────────────────────────────────────────────────────────
hex    = "0.4"
ethabi = "18"

# ── Logging ────────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# ── Metrics ────────────────────────────────────────────────────────────────────
metrics                     = "0.22"
metrics-exporter-prometheus = "0.13"

# ── Error handling ─────────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── Config / environment ───────────────────────────────────────────────────────
dotenvy = "0.15"

# ── API server ─────────────────────────────────────────────────────────────────
axum       = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# ── Concurrency ────────────────────────────────────────────────────────────────
dashmap     = "5"
futures     = "0.3"
futures-util= "0.3"
parking_lot = "0.12"   # faster RwLock for hot paths
bincode     = "1.3"

# ── Time ───────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── UUID ───────────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }

# ── Crypto (Flashbots auth signing) ───────────────────────────────────────────
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
